[project]
name = "fakturama-image-to-cash"
version = "0.1.0"
description = "Turns one order image into a saved, verified Order and linked Invoice in Fakturama."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
    "rapidocr-onnxruntime>=1.4.4",
    "uiautomation>=2.0.29",
]
